services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcg_maroc_ai
      POSTGRES_USER: pcg
      POSTGRES_PASSWORD: pcg
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcg -d pcg_maroc_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pcg_postgres_data:/var/lib/postgresql/data

volumes:
  pcg_postgres_data:
